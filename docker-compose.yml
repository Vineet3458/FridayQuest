version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fridayquest-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fridayquest
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fridayquest-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fridayquest
      CORS_ORIGINS: http://localhost:3000,http://client:3000
      JWT_ACCESS_SECRET: fridayquest_production_access_secret_2026_xyz
      JWT_REFRESH_SECRET: fridayquest_production_refresh_secret_2026_xyz
      COOKIE_SECRET: fridayquest_production_cookie_secret_2026_xyz
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fridayquest-client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_WS_URL: http://localhost:5000
    depends_on:
      - server

volumes:
  mongo-data:
